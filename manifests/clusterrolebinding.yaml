# In-cluster deployment (#2) — safety-model.md layer 3, the server-side
# enforcement boundary. Contract: .ai/spec/what/in-cluster-deployment.md
# rule 4 + ADR decisions/0006-cluster-reader-binding.md: bind to the BUILT-IN
# cluster-reader role — the repo defines no role of its own (nothing wider,
# nothing narrower). The kubectl_readonly guard is defense-in-depth on top.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ols-patroller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-reader
subjects:
  - kind: ServiceAccount
    name: ols-patroller
    namespace: ols-patroller
