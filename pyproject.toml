[project]
name = "ols-patroller"
version = "0.1.0"
description = "Proactive, read-only SRE patrol agent for OpenShift/Kubernetes clusters"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "langchain-openai>=1.0",
    "pydantic>=2",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=8", "pyyaml>=6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
